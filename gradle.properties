# Project-wide Gradle settings - 智能药箱APP优化配置
# 创建时间: 2026-02-18

#------------------------------------------------------------------------------
# JVM参数配置
#------------------------------------------------------------------------------
# 增加内存分配以加快构建速度
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

#------------------------------------------------------------------------------
# Gradle构建优化
#------------------------------------------------------------------------------
# 启用Gradle守护进程 (保持Gradle进程在后台运行)
org.gradle.daemon=true

# 并行编译多个模块
org.gradle.parallel=true

# 按需配置 (只配置需要的项目)
org.gradle.configureondemand=true

# 启用构建缓存
org.gradle.caching=true

#------------------------------------------------------------------------------
# Kotlin配置
#------------------------------------------------------------------------------
# Kotlin编译守护进程配置
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC

# 禁用Kotlin守护进程（解决daemon问题）
# 如果遇到daemon问题，取消下面这行的注释
# kotlin.compiler.execution.strategy="in-process"

# 官方代码风格
kotlin.code.style=official

# 增量编译
kotlin.incremental=true

# Android增量编译
kotlin.incremental.android=true

# Kotlin编译缓存
kotlin.caching.enabled=true

# 并行Kotlin编译任务
kotlin.parallel.tasks.in.project=true

#------------------------------------------------------------------------------
# Android配置
#------------------------------------------------------------------------------
# 使用AndroidX库
android.useAndroidX=true

# 自动迁移支持库到AndroidX
android.enableJetifier=true

# 非传递性R类 (减少编译时间)
android.nonTransitiveRClass=true

# 启用R8完整模式 (发布构建优化)
android.enableR8.fullMode=false

#------------------------------------------------------------------------------
# 构建特性配置 (已迁移到模块级 build.gradle)
#------------------------------------------------------------------------------
# 注意: android.defaults.buildfeatures.* 已弃用
# 请在 app/build.gradle 的 buildFeatures 块中配置
