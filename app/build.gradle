plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.smartmedicine'
    // 编译SDK: API 34 (Android 14)
    // 注意: 如需完整API 35支持，请在SDK Manager中安装Android 15 (API 35)
    compileSdk 34

    defaultConfig {
        applicationId "com.smartmedicine"
        // 保持minSdk 24以支持Android 7.0+设备
        minSdk 24
        // 目标API: 34 (Android 14)
        // 已适配API 35代码，升级SDK后可支持Android 15
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }
    
    // ============================================
    // 签名配置 - 用于打包Release APK
    // ============================================
    signingConfigs {
        release {
            // 从签名配置文件读取（如果不存在则使用debug签名）
            def signingPropsFile = file('signing.properties')
            if (signingPropsFile.exists()) {
                def signingProps = new Properties()
                signingProps.load(new FileInputStream(signingPropsFile))
                
                storeFile file(signingProps['STORE_FILE'])
                storePassword signingProps['STORE_PASSWORD']
                keyAlias signingProps['KEY_ALIAS']
                keyPassword signingProps['KEY_PASSWORD']
            } else {
                // 使用debug签名作为fallback（仅测试用）
                storeFile file('../debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            // Debug配置
            debuggable true
            minifyEnabled false
        }
        release {
            // Release配置
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // 应用签名配置
            signingConfig signingConfigs.release
            
            // 优化APK
            zipAlignEnabled true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }
    
    composeOptions {
        // 升级Compose编译器以支持Kotlin 1.9.22和API 35
        kotlinCompilerExtensionVersion '1.5.10'
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    // 使用AGP自动管理的构建工具版本
    // AGP 8.x会自动选择兼容的build tools，无需手动指定
}

dependencies {
    // ============================================
    // AndroidX Core - 更新至API 35兼容版本
    // ============================================
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    
    // Lifecycle - API 35需要2.8.0+
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    
    // Activity Compose - 更新以支持预测性返回手势 (API 35特性)
    implementation 'androidx.activity:activity-compose:1.9.3'
    
    // ============================================
    // Jetpack Compose BOM - 2024.10.00 支持API 35
    // ============================================
    def composeBom = platform('androidx.compose:compose-bom:2024.10.00')
    implementation composeBom
    androidTestImplementation composeBom
    
    // Material Design 3 (Compose)
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Material Components - 更新以支持Material3动态主题
    implementation 'com.google.android.material:material:1.12.0'
    
    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    
    // Navigation Compose - 更新以支持类型安全导航 (API 35)
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    
    // MQTT Client - Eclipse Paho
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'
    
    // Coroutines for async operations
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
    
    // DataStore for preferences
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    
    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
